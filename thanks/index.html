---
title: Confirming your signature
permalink: /thanks/
---
<h1>One moment</h1>
<p id="thanks-msg">Confirming your signature…</p>
<p><a id="back-link" href="{{ '/' | relative_url }}">Back to the petition</a></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get('p') || '';
  const base = (window.TA && window.TA.baseurl) || '';
  const msg = document.getElementById('thanks-msg');
  const url = location.origin + base + '/p/' + slug + '/';
  document.getElementById('back-link').href = url;
  if (!window.TA || /YOUR-PROJECT/.test(window.TA.supabaseUrl)) { msg.textContent = 'Signing is not switched on yet.'; return; }
  const sb = window.supabase.createClient(window.TA.supabaseUrl, window.TA.supabaseAnonKey);
  if (!slug) { msg.textContent = 'This link is missing the petition name, so it cannot confirm a signature. Go back to the petition and sign again to get a fresh link.'; document.getElementById('back-link').href = location.origin + base + '/'; return; }
  const expired = 'This link has already been used or has expired. If you already confirmed, you are done. Otherwise sign again to get a fresh link.';
  async function finish() {
    const { error } = await sb.rpc('confirm_my_signature', { p_slug: slug });
    if (error) { msg.textContent = 'Could not confirm. Please try the link again in a moment.'; return false; }
    await sb.auth.signOut();
    return true;
  }
  // Is the tab the person signed on still open and waiting? Ask it; if it answers, let it finish
  // and keep this tab quiet instead of loading the petition a second time.
  function handBack() {
    let chan; try { chan = new BroadcastChannel('ta-sign'); } catch (e) { return Promise.resolve(false); }
    return new Promise(resolve => {
      let settled = false;
      const end = v => { if (!settled) { settled = true; chan.close(); resolve(v); } };
      chan.onmessage = ev => { if (ev.data && ev.data.type === 'pong' && ev.data.slug === slug) { chan.postMessage({ type: 'confirmed', slug }); end(true); } };
      chan.postMessage({ type: 'ping', slug });
      setTimeout(() => end(false), 600);
    });
  }
  async function done() {
    if (!(await finish())) return;
    if (await handBack()) {
      document.querySelector('h1').textContent = 'Confirmed';
      msg.textContent = 'Your signature is counted. The page you signed on has finished too, so you can close this tab and go back to it.';
      document.getElementById('back-link').textContent = 'Or open the petition here';
      return;
    }
    location.replace(url + '?signed=1#sign');
  }
  const tokenHash = params.get('token_hash');
  if (tokenHash) {
    const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: params.get('type') || 'magiclink' });
    if (error) { msg.textContent = expired; return; }
    await done();
    return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { msg.textContent = expired; return; }
  await done();
})();
</script>
