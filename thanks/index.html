<h1>Thank you</h1>
<p id="thanks-msg">Confirming your signature…</p>
<div id="thanks-next" hidden>
  <p class="note"><strong>Your signature is confirmed and counted.</strong></p>
  <h2>Two more things that help</h2>
  <ol>
    <li><a id="print-link" class="btn" href="#">Print your House of Assembly signing page</a> and sign it in ink. The House accepts paper only.</li>
    <li>Share the petition: <a id="share-link" href="#"></a></li>
  </ol>
  <p><a id="back-link" href="#">Back to the petition</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const slug = params.get('p') || '';
  const base = (window.TA && window.TA.baseurl) || '';
  const msg = document.getElementById('thanks-msg');
  document.getElementById('print-link').href = base + '/print/?p=' + encodeURIComponent(slug);
  const url = location.origin + base + '/p/' + slug + '/';
  const share = document.getElementById('share-link'); share.href = url; share.textContent = url;
  document.getElementById('back-link').href = url;
  if (!window.TA || /YOUR-PROJECT/.test(window.TA.supabaseUrl)) { msg.textContent = 'Signing is not switched on yet.'; return; }
  const sb = window.supabase.createClient(window.TA.supabaseUrl, window.TA.supabaseAnonKey);
  async function finish() {
    const { data, error } = await sb.rpc('confirm_my_signature', { p_slug: slug });
    if (error) { msg.textContent = 'Could not confirm: ' + error.message; return; }
    msg.hidden = true; document.getElementById('thanks-next').hidden = false;
    await sb.auth.signOut();
  }
  // One click: the email links here with a token_hash and this page confirms it
  // as soon as it loads. If a mail scanner has already used the code, the page
  // says so and offers a fresh link, so nobody is left stuck.
  const tokenHash = params.get('token_hash');
  if (tokenHash) {
    msg.textContent = 'Confirming your signature…';
    const { error } = await sb.auth.verifyOtp({ token_hash: tokenHash, type: params.get('type') || 'magiclink' });
    if (error) {
      msg.innerHTML = 'This link has already been used or has expired. <a href="' + url + '#sign">Sign again</a> to get a fresh one, or if you already confirmed, you are done.';
      return;
    }
    await finish();
    return;
  }
  // Older path: the session arrives in the URL hash.
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { msg.textContent = 'This link has expired or was already used. If your signature is not counted, sign again and click the new link.'; return; }
  await finish();
})();
</script>
