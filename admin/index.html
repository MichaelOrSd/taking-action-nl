---
title: Organiser dashboard
permalink: /admin/
---
<h1>Organiser dashboard</h1>
<div id="login" class="card">
  <p class="lead" style="margin-top:0">Sign in with the email registered for your petition. A one-time sign-in link is emailed to that address; nothing to remember.</p>
  <form id="login-form" class="sign-form" onsubmit="return false">
    <div class="field"><label for="le">Email</label><input id="le" type="email" inputmode="email" autocomplete="email" enterkeyhint="send" required></div>
    <button class="btn btn-primary" id="lb" type="button">Email me a sign-in link</button>
    <p class="form-msg" id="lm" role="status" aria-live="polite"></p>
  </form>
</div>
<div id="dash" hidden>
  <p class="dash-bar"><span>Signed in as <strong id="who"></strong></span> <button class="btn btn-small" id="out" type="button">Sign out</button></p>
  <div class="toolbar">
    <div class="field"><label for="pet">Petition</label><select id="pet"></select></div>
    <div class="field"><label for="q">Search</label><input id="q" type="search" autocomplete="off" placeholder="Name, email, street or community"></div>
  </div>
  <div class="dash-actions">
    <ul class="summary" id="stats" aria-live="polite"></ul>
    <div class="btn-row">
      <button class="btn btn-small" id="refresh" type="button">Refresh</button>
      <button class="btn btn-small" id="csv" type="button">CSV for council</button>
      <button class="btn btn-small" id="csv-stmt" type="button">CSV of statement volunteers</button>
      <button class="btn btn-small" id="csv-sup" type="button" hidden>CSV of supporters</button>
    </div>
  </div>
  <p id="sup-stats" class="muted"></p>
  <ul class="sig-list" id="sig-list" aria-live="polite"></ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  if (!window.TA || /YOUR-PROJECT/.test(window.TA.supabaseUrl)) { document.getElementById('lm').textContent = 'Database not connected.'; return; }
  const base = (window.TA && window.TA.baseurl) || '';
  const sb = window.supabase.createClient(window.TA.supabaseUrl, window.TA.supabaseAnonKey);
  const $ = id => document.getElementById(id);
  let rows = [];
  $('lb').onclick = async () => {
    const { error } = await sb.auth.signInWithOtp({ email: $('le').value.trim(), options: { emailRedirectTo: location.origin + base + '/admin/?login=1', shouldCreateUser: false } });
    $('lm').textContent = error ? error.message : 'Check your email and click the sign-in link. Look in Junk or Spam too.'; $('lm').className = 'form-msg ' + (error ? 'err' : 'ok');
  };
  // Arriving from the email link: verify the token, then reload signed in.
  const lp = new URLSearchParams(location.search);
  if (lp.get('token_hash')) {
    const { error } = await sb.auth.verifyOtp({ token_hash: lp.get('token_hash'), type: lp.get('type') || 'magiclink' });
    history.replaceState(null, '', location.pathname);
    if (error) { $('lm').textContent = 'That link has expired or was already used. Ask for a new one.'; $('lm').className = 'form-msg err'; } else { location.reload(); return; }
  }
  const list = $('sig-list');
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const state = (text, kind) => { list.innerHTML = '<li class="list-state ' + (kind || '') + '">' + text + '</li>'; };
  async function load() {
    const slug = $('pet').value;
    list.classList.toggle('one-petition', slug !== '__all');
    state('Loading…');
    const query = sb.from('signatures').select('id,petition_slug,created_at,full_name,street,community,province,postal_code,email,phone,confirmed,in_local_area,paper_signed,consent_updates,consent_statement').order('created_at', { ascending: false });
    const qr = slug === '__all' ? query : query.eq('petition_slug', slug);
    const { data, error } = await qr;
    if (error) { state('Could not load signatures: ' + esc(error.message) + ' Press Refresh to try again.', 'err'); return; }
    rows = data || [];
    render();
  }
  const tick = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  const chip = (on, label) => on ? '<span class="chip">' + tick + label + '</span>' : '';
  function render() {
    const term = $('q').value.trim().toLowerCase();
    const shown = term ? rows.filter(r => [r.full_name, r.email, r.street, r.community, r.petition_slug].join(' ').toLowerCase().includes(term)) : rows;
    const conf = rows.filter(r => r.confirmed).length, paper = rows.filter(r => r.paper_signed).length, local = rows.filter(r => r.in_local_area && r.confirmed).length;
    $('stats').innerHTML = (term ? '<li><b>' + shown.length + '</b> shown of ' + rows.length + '</li>' : '<li><b>' + rows.length + '</b> signed</li>') + '<li><b>' + conf + '</b> confirmed</li><li><b>' + local + '</b> local</li><li><b>' + paper + '</b> on paper</li>';
    list.innerHTML = '';
    if (!rows.length) { state('No signatures yet. Share the petition link to get the first one.'); return; }
    if (!shown.length) { state('Nothing matches “' + esc($('q').value.trim()) + '”.'); return; }
    for (const r of shown) {
      const li = document.createElement('li'); li.className = 'sig'; li.dataset.id = r.id;
      const addr = [r.street, r.community, r.province, r.postal_code].filter(Boolean).map(esc).join(', ');
      const contact = [r.email, r.phone].filter(Boolean).map(esc).join(' · ');
      li.innerHTML = '<div class="sig-main">'
        + '<div class="sig-head"><span class="name">' + esc(r.full_name) + '</span>' + (r.confirmed ? '<span class="pill pill-ok">Confirmed</span>' : '<span class="pill pill-wait">Waiting for email click</span>') + '</div>'
        + '<div class="sig-line">' + contact + '</div>'
        + '<div class="sig-line">' + addr + '</div>'
        + '<div class="sig-meta"><span class="sub">' + esc(r.created_at.slice(0,10)) + '</span><span class="sub col-pet">' + esc(r.petition_slug) + '</span>' + chip(r.in_local_area, 'Local') + chip(r.consent_updates, 'Updates') + chip(r.consent_statement, 'Statement') + '</div>'
        + '</div><div class="sig-side">'
        + '<label class="check check-small"><input type="checkbox" class="paper" data-id="' + r.id + '" ' + (r.paper_signed ? 'checked' : '') + '> On paper</label>'
        + '<button class="btn btn-small btn-quiet-danger del" data-id="' + r.id + '" type="button">Remove</button>'
        + '</div>';
      list.appendChild(li);
    }
    list.querySelectorAll('.paper').forEach(cb => cb.onchange = async () => {
      const { error } = await sb.from('signatures').update({ paper_signed: cb.checked }).eq('id', cb.dataset.id);
      if (error) { cb.checked = !cb.checked; alert('Could not save: ' + error.message); return; }
      const r = rows.find(x => String(x.id) === cb.dataset.id); if (r) r.paper_signed = cb.checked;
      render();
    });
    list.querySelectorAll('.del').forEach(b => b.onclick = async () => {
      const r = rows.find(x => String(x.id) === b.dataset.id);
      if (!confirm('Remove the signature of ' + (r ? r.full_name : 'this person') + '? This cannot be undone.')) return;
      b.disabled = true; b.textContent = 'Removing…';
      const { error } = await sb.from('signatures').delete().eq('id', b.dataset.id);
      if (error) { b.disabled = false; b.textContent = 'Remove'; alert('Could not remove: ' + error.message); return; }
      rows = rows.filter(x => String(x.id) !== b.dataset.id);
      render();
    });
  }
  function csv(list, cols) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const out = [cols.join(',')].concat(list.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv' })); a.download = $('pet').value + '-' + (cols.includes('email') ? 'statements' : 'council') + '.csv'; a.click();
  }
  $('csv').onclick = () => csv(rows.filter(r => r.confirmed), ['petition_slug','created_at','full_name','street','community','province','postal_code','in_local_area','paper_signed']);
  $('csv-stmt').onclick = () => csv(rows.filter(r => r.confirmed && r.consent_statement), ['created_at','full_name','street','community','province','email','phone']);
  $('refresh').onclick = load;
  $('q').oninput = render;
  $('pet').onchange = load;
  $('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  $('login').hidden = true; $('dash').hidden = false; $('who').textContent = session.user.email;
  const { data: mine } = await sb.from('organisers').select('petition_slug');
  const slugs = (mine || []).map(m => m.petition_slug);
  const owner = slugs.includes('*');
  const allSlugs = [{% for p in site.petitions %}'{{ p.slug }}'{% unless forloop.last %},{% endunless %}{% endfor %}];
  const petSlugs = owner ? ['__all'].concat(allSlugs) : slugs.filter(s => s !== '*');
  $('pet').innerHTML = petSlugs.map(s => '<option value="' + s + '">' + (s === '__all' ? 'All petitions' : s) + '</option>').join('') || '<option value="">(no petitions assigned to this email)</option>';
  if (petSlugs.length) load();
  if (owner) {
    const { data: sup } = await sb.from('supporters').select('created_at,full_name,email,community,province,source,unsubscribe_token,unsubscribed_at').order('created_at', { ascending: false });
    const live = (sup || []).filter(r => !r.unsubscribed_at);
    $('sup-stats').textContent = 'Supporter pool: ' + live.length + (live.length === 1 ? ' person' : ' people') + ' opted in to hear about future petitions' + ((sup || []).length - live.length ? ' (' + ((sup || []).length - live.length) + ' unsubscribed)' : '') + '.';
    $('csv-sup').hidden = false;
    $('csv-sup').onclick = () => {
      const rows = live.map(r => Object.assign({}, r, { unsubscribe_link: location.origin + base + '/unsubscribe/?t=' + r.unsubscribe_token }));
      const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
      const cols = ['created_at','full_name','email','community','province','source','unsubscribe_link'];
      const out = [cols.join(',')].concat(rows.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv' })); a.download = 'supporters.csv'; a.click();
    };
  }
})();
</script>
