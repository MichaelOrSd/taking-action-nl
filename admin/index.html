---
title: Organiser dashboard
permalink: /admin/
---
<h1>Organiser dashboard</h1>
<div id="login" class="card">
  <p>Organisers sign in with the email registered for their petitions. A one-time link is sent to that address.</p>
  <form id="login-form" class="sign-form" onsubmit="return false">
    <div class="field"><label for="le">Email</label><input id="le" type="email" required></div>
    <button class="btn btn-primary" id="lb" type="button">Send sign-in link</button>
    <p class="form-msg" id="lm"></p>
  </form>
</div>
<div id="dash" hidden>
  <p>Signed in as <span id="who"></span>. <button class="btn btn-small" id="out" type="button">Sign out</button></p>
  <div class="field"><label for="pet">Petition</label><select id="pet"></select></div>
  <p><button class="btn" id="refresh" type="button">Refresh</button> <button class="btn" id="csv" type="button">Download CSV (council list)</button> <button class="btn" id="csv-stmt" type="button">Download statement volunteers</button></p>
  <p id="stats" class="muted"></p>
  <div style="overflow-x:auto"><table id="tbl"><thead><tr><th>Date</th><th>Name</th><th>Address</th><th>Community</th><th>Prov.</th><th>Confirmed</th><th>Local</th><th>Paper</th><th>Updates</th><th>Statement</th><th></th></tr></thead><tbody></tbody></table></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async function () {
  if (!window.TA || /YOUR-PROJECT/.test(window.TA.supabaseUrl)) { document.getElementById('lm').textContent = 'Database not connected.'; return; }
  const base = (window.TA && window.TA.baseurl) || '';
  const sb = window.supabase.createClient(window.TA.supabaseUrl, window.TA.supabaseAnonKey);
  const $ = id => document.getElementById(id);
  let rows = [];
  $('lb').onclick = async () => {
    const { error } = await sb.auth.signInWithOtp({ email: $('le').value.trim(), options: { emailRedirectTo: location.origin + base + '/admin/' } });
    $('lm').textContent = error ? error.message : 'Check your email for the sign-in link.';
  };
  async function load() {
    const slug = $('pet').value;
    const { data, error } = await sb.from('signatures').select('id,created_at,full_name,street,community,province,postal_code,email,confirmed,in_local_area,paper_signed,consent_updates,consent_statement').eq('petition_slug', slug).order('created_at', { ascending: false });
    if (error) { $('stats').textContent = error.message; return; }
    rows = data || [];
    const conf = rows.filter(r => r.confirmed).length, paper = rows.filter(r => r.paper_signed).length, local = rows.filter(r => r.in_local_area && r.confirmed).length;
    $('stats').textContent = rows.length + ' signatures, ' + conf + ' confirmed, ' + local + ' confirmed in local area, ' + paper + ' also on paper.';
    const tb = document.querySelector('#tbl tbody'); tb.innerHTML = '';
    for (const r of rows) {
      const tr = document.createElement('tr');
      const esc = s => String(s == null ? '' : s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
      tr.innerHTML = '<td>' + esc(r.created_at.slice(0,10)) + '</td><td>' + esc(r.full_name) + '</td><td>' + esc(r.street) + '</td><td>' + esc(r.community) + '</td><td>' + esc(r.province) + '</td><td>' + (r.confirmed ? 'yes' : 'no') + '</td><td>' + (r.in_local_area ? 'yes' : '') + '</td><td><input type="checkbox" data-id="' + r.id + '" class="paper" ' + (r.paper_signed ? 'checked' : '') + '></td><td>' + (r.consent_updates ? 'yes' : '') + '</td><td>' + (r.consent_statement ? 'yes' : '') + '</td><td><button class="btn btn-small del" data-id="' + r.id + '" type="button">Remove</button></td>';
      tb.appendChild(tr);
    }
    tb.querySelectorAll('.paper').forEach(cb => cb.onchange = async () => { await sb.from('signatures').update({ paper_signed: cb.checked }).eq('id', cb.dataset.id); });
    tb.querySelectorAll('.del').forEach(b => b.onclick = async () => { if (confirm('Remove this signature? This cannot be undone.')) { await sb.from('signatures').delete().eq('id', b.dataset.id); load(); } });
  }
  function csv(list, cols) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const out = [cols.join(',')].concat(list.map(r => cols.map(c => q(r[c])).join(','))).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/csv' })); a.download = $('pet').value + '-' + (cols.includes('email') ? 'statements' : 'council') + '.csv'; a.click();
  }
  $('csv').onclick = () => csv(rows.filter(r => r.confirmed), ['created_at','full_name','street','community','province','postal_code','in_local_area','paper_signed']);
  $('csv-stmt').onclick = () => csv(rows.filter(r => r.confirmed && r.consent_statement), ['created_at','full_name','street','community','province','email']);
  $('refresh').onclick = load;
  $('pet').onchange = load;
  $('out').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  $('login').hidden = true; $('dash').hidden = false; $('who').textContent = session.user.email;
  const { data: mine } = await sb.from('organisers').select('petition_slug');
  const slugs = (mine || []).map(m => m.petition_slug);
  $('pet').innerHTML = slugs.map(s => '<option value="' + s + '">' + s + '</option>').join('') || '<option value="">(no petitions assigned to this email)</option>';
  if (slugs.length) load();
})();
</script>
