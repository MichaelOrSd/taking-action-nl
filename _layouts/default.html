<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: page.description | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | truncate: 200 }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>window.TA = { baseurl: "{{ site.baseurl }}", province: "{{ site.platform.province }}", provinceCode: "{{ site.platform.province_code }}" };</script>
  <script src="{{ '/assets/js/config.js' | relative_url }}"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark" aria-hidden="true">NL</span>
      <span class="brand-name">{{ site.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/#petitions' | relative_url }}">Petitions</a>
      <a href="{{ '/start/' | relative_url }}">Start a petition</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main id="main" class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <p><strong>{{ site.title }}</strong> · <a href="{{ '/about/' | relative_url }}">About</a> · <a href="{{ '/privacy/' | relative_url }}">Privacy</a> · <a href="{{ '/start/' | relative_url }}">Start a petition</a> · <a href="{{ '/projects/' | relative_url }}">Projects</a> · <a href="https://github.com/MichaelOrSd/taking-action-nl">Source</a></p>
    <p>Run by {{ site.platform.owner }}. Not affiliated with any government, town or party.</p>
  </footer>
<script>
// A used or replaced email link lands here with an error in the address. Say so plainly.
if (/error_code=otp_expired|error=access_denied/.test(location.hash)) {
  var n = document.createElement('p');
  n.setAttribute('role', 'alert');
  n.style.cssText = 'max-width:44rem;margin:1rem auto;padding:.75rem 1rem;border:1px solid currentColor;border-radius:6px';
  n.textContent = 'That email link has already been used or has been replaced by a newer one. If you asked for the email twice, use the newest one. Otherwise open the petition and sign again to get a fresh link.';
  var m = document.querySelector('main') || document.body; m.insertBefore(n, m.firstChild);
  history.replaceState(null, '', location.pathname + location.search);
}
</script>
</body>
</html>
